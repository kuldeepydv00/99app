<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B141C" />
  <title>You're offline · 99xmatka</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0F1923; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .card { width: 100%; max-width: 360px; text-align: center; }
    .logo { width: 84px; height: 84px; border-radius: 20px; display: block; margin: 0 auto 22px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
    .icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(242,193,78,.12); color: #F2C14E;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p { color: #B1BAD3; font-size: 14px; line-height: 1.55; }
    button { margin-top: 24px; width: 100%; border: 0; border-radius: 10px; padding: 14px 16px;
      background: #F2C14E; color: #111; font-size: 15px; font-weight: 800; cursor: pointer; }
    button:active { transform: scale(.98); }
    .small { margin-top: 14px; font-size: 12px; color: #7C8AA5; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/icon-192.png" alt="99xmatka" />
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2.01-1.55"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your mobile data or Wi-Fi. Your wallet and bets are safe on our server.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="small">This page reloads by itself when the internet is back.</p>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
